name: MRT exit regression formatter (temporary)
on:
  push:
    branches: ["feat/postgis-nearby-web-ui"]
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
      - run: vp install
      - shell: bash
        run: |
          vp fmt tests/unit/NearbyMrtExits.test.tsx
          printf 'MRTFMT_BEGIN\n'
          base64 -w 0 tests/unit/NearbyMrtExits.test.tsx
          printf '\nMRTFMT_END\n'
