name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: vp install + check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run checks
        run: vp run check

      # perf-baseline.sh re-runs build, check:bundle, test, typecheck and lint —
      # everything `vp run check` above just ran. Nothing compares the artifact
      # against a previous one, so paying that on every pull request would
      # roughly double PR feedback time for a trend record. Capture it on main
      # (and on demand) instead, where the trend is what matters.
      - name: Capture performance baseline
        if: github.event_name != 'pull_request'
        run: ./scripts/perf-baseline.sh performance-baseline.json

      - name: Upload performance baseline
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline
          path: performance-baseline.json
          retention-days: 14
