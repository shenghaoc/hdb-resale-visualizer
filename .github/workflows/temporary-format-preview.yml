name: Temporary format preview (no writes)
on:
  push:
    branches:
      - feat/neon-nearby-budget
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          node-version: "24"
          run-install: false
      - run: vp install
      - name: Print the formatter's source-only diff (no secrets, no artifact upload)
        run: |
          vp fmt docs/architecture/postgis-nearby.md functions/_lib/nearby-budget.ts tests/deployed-path/local-rehearsal.mjs tests/unit/nearby-budget.test.ts tests/unit/nearby-places-worker-gate.test.ts worker/index.ts
          git diff -- docs/architecture/postgis-nearby.md functions/_lib/nearby-budget.ts tests/deployed-path/local-rehearsal.mjs tests/unit/nearby-budget.test.ts tests/unit/nearby-places-worker-gate.test.ts worker/index.ts
