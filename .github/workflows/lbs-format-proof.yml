name: LBS formatter proof (temporary)
on:
  push:
    branches: ["feat/postgis-lbs-nearby"]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
      - run: vp install
      - name: Capture formatted files for review
        shell: bash
        run: |
          vp fmt docs/architecture/postgis-nearby.md functions/api/nearby-places.ts shared/nearby-places.ts tests/unit/nearby-places.test.ts worker/nearby-spatial-query.ts
          for f in docs/architecture/postgis-nearby.md functions/api/nearby-places.ts shared/nearby-places.ts tests/unit/nearby-places.test.ts worker/nearby-spatial-query.ts; do
            printf 'LBSFMT_BEGIN:%s\n' "$f"
            base64 -w 0 "$f"
            printf '\nLBSFMT_END:%s\n' "$f"
          done
